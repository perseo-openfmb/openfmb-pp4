name: openfmb-pp4-integrated

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  nats:
    image: nats:2.14
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
    networks:
      - openfmb_devv

  adapter:
    image: oesinc/openfmb.adapters:a30d1d0
    container_name: adapter
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
    volumes:
      - ./config:/cfg
      - ./modbus-master:/modbus-master
    command: -c /cfg/adapter.yaml
    networks:
      - openfmb_devv
    logging: *default-logging

  hmi:
    image: openfmb-hmi:latest
    container_name: hmi
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
    volumes:
      - ./hmi:/cfg
    environment:
      APP_CONF: /cfg/config/app.toml
      APP_DIR_NAME: /cfg
    ports:
      - "32771:32771"
    networks:
      - openfmb_devv
    logging: *default-logging

  timescale:
    image: timescale/timescaledb:latest-pg12-oss
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./timescale_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_locks_per_transaction=256", "-c", "shared_buffers=1GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openfmb_devv

  sql-proxy:
    build:
      context: ./app/sql-proxy
    container_name: sql-proxy
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
    ports:
      - "5433:5433"
    networks:
      - openfmb_devv
    logging: *default-logging

  db-backup:
    image: postgres:12-alpine
    container_name: db_backup
    restart: unless-stopped
    # Write dumps as the host user (uid 1000) so ./backups stays readable and
    # syncable, instead of root-owned like the timescale_data dir.
    user: "1000:1000"
    depends_on:
      timescale:
        condition: service_healthy
    environment:
      PGHOST: timescale
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${DB_PASS}
      PGDATABASE: ${DB_NAME}
      BACKUP_INTERVAL_SECONDS: "86400" # un respaldo cada 24 h
      BACKUP_KEEP: "7"                 # conservar los 7 dumps más recientes
    volumes:
      - ./backups:/backups
      - ./scripts/db_backup_loop.sh:/usr/local/bin/db_backup_loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db_backup_loop.sh"]
    networks:
      - openfmb_devv
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_BASIC_ENABLED=true
      # Credenciales del admin. Grafana las reaplica en cada arranque, asi que
      # el .env es la fuente de verdad de la clave de admin.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      # Nadie se auto-registra ni crea organizaciones; el usuario de solo
      # lectura lo crea el servicio grafana-init.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_VIEWERS_CAN_EDIT=false
      # Tema por defecto declarativo: antes vivia solo dentro de grafana.db y
      # se perdio al cambiar el bind-mount por un volumen con nombre.
      - GF_USERS_DEFAULT_THEME=${GRAFANA_THEME:-light}
      - DB_PASS=${DB_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - openfmb_devv

  # Grafana no sabe provisionar usuarios por archivo (solo datasources,
  # dashboards y alertas), asi que el usuario de solo lectura se crea por API
  # con un contenedor de un solo uso. El script es idempotente.
  grafana-init:
    image: grafana/grafana:11.5.1
    container_name: grafana_init
    restart: "no"
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_USER}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GRAFANA_VIEWER_USER: ${GRAFANA_VIEWER_USER}
      GRAFANA_VIEWER_PASSWORD: ${GRAFANA_VIEWER_PASSWORD}
      GRAFANA_VIEWER_NAME: ${GRAFANA_VIEWER_NAME:-Consulta PERSEO}
      GRAFANA_THEME: ${GRAFANA_THEME:-light}
    volumes:
      - ./scripts/grafana_provision_users.sh:/usr/local/bin/grafana_provision_users.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/grafana_provision_users.sh"]
    networks:
      - openfmb_devv
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${EMAIL_PGADMIN}
      PGADMIN_DEFAULT_PASSWORD: ${PASS_PGADMIN}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - openfmb_devv

  mi-api-python:
    build: ./app/openfmb-api
    container_name: api_python
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - openfmb_devv

  search-engine:
    build: ./app/search-engine
    container_name: search-engine
    restart: unless-stopped
    ports:
      - "5500:5500"
    networks:
      - openfmb_devv
    logging: *default-logging

networks:
  openfmb_devv:
    driver: bridge

volumes:
  pgadmin_data:
  grafana_data:
