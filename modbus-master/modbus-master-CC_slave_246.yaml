- name: SwitchDiscreteControlProfile
  poll_period_ms: 700
  command-order:
  - first
  tolerance-ms: 2000
  mapping:
    controlMessageInfo:
      messageInfo:
        identifiedObject:
          description:
            value:
              string-field-type: ignored
          mRID:
            value:
              string-field-type: generated_uuid
          name:
            value:
              string-field-type: ignored
        messageTimeStamp:
          timestamp-field-type: ignored
    protectedSwitch:
      conductingEquipment:
        namedObject:
          description:
            value:
              string-field-type: ignored
          name:
            value:
              string-field-type: ignored
        mRID:
          string-field-type: primary_uuid
          value: '?'
    switchDiscreteControl:
      controlValue:
        identifiedObject:
          description:
            value:
              string-field-type: ignored
          mRID:
            value:
              string-field-type: ignored
          name:
            value:
              string-field-type: ignored
        modBlk:
          value:
            bool-field-type: ignored
        reset:
          value:
            bool-field-type: ignored
      check:
        interlockCheck:
          value:
            bool-field-type: ignored
        synchroCheck:
          value:
            bool-field-type: ignored
      switchDiscreteControlXSWI:
        logicalNodeForControl:
          logicalNode:
            identifiedObject:
              description:
                value:
                  string-field-type: ignored
              mRID:
                value:
                  string-field-type: ignored
              name:
                value:
                  string-field-type: ignored
        Pos:
          phs3:
            ctlVal:
              bool-field-type: mapped
              when-true:
              - output-type: write_single_register_uint16
                command-id: first
                index: 33
                value: 3 
              when-false:
              - output-type: write_single_register_uint16
                command-id: first
                index: 33
                value: 2 #valor seguro de potencia al apagar                
          phsA:
            ctlVal:
              bool-field-type: ignored
          phsB:
            ctlVal:
              bool-field-type: ignored
          phsC:
            ctlVal:
              bool-field-type: ignored
        ResetProtectionPickup:
          ctlVal:
            bool-field-type: ignored
