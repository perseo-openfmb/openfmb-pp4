  edition: 2.0
  version: 2.1.0.0
  plugin: ""
logging:
  logger-name: application
  console:
    enabled: true
  rotating-file:
    enabled: false
    path: adapter.log
    max-size: 10485760 # 10 MB
    max-files: 10 # keep last 10 files
plugins:
